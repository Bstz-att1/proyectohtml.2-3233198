<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Datos de Usuario</title>
</head>
<body>
    <main>
        <section>
        <h1>Datos de Contacto</h1>
        <p>
            Ingresa tus datos en el siguiente formulario, porfavor sin dejar espacios en blanco.</p>
        <form action="">
            <div>
                <label for="Nombre">Nombre</label>
                <input type="text" name="Nombre" id="Nombre" required>
            </div>
            <br>
            <div>
                <label for="Apellido">Apellido</label>
                <input type="text" name="Apellido" id="Apellido" required>
            </div>
            <br>
            <div>
                <label for="Edad">Edad</label>
                <input type="number" name="Edad" id="Edad" step="1" max="100">
            </div>
            <br>
            <div>
                <label for="Ciudad">Ciudad</label>
                <select name="Ciudad" id="Ciudad" required>
                    <option value="1">Bucaramanga</option>
                    <option value="2">Piedecuesta</option>
                    <option value="3">Giron</option>
                    <option value="4">Floridablanca</option>
                </select>
            </div>
            <br>
            <div>
                <label for="Sugerencias">Sugerenecias:</label>
                <textarea name="Sugerencias" id="Sugerencias" cols="50"></textarea>
            </div>
        <p>
                <input type="submit" name="Enviar" id="Enviar">
                <input type="reset"
        </p>
        </form>
        </section>
    </main>
</body>
</html>
